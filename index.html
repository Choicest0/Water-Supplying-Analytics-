<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroPulse Dehradun | Smart Water Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Dehradun Urban Water Supply Network</h1>
            <p>Real-time IoT Telemetry & Purity Analytics Engine</p>
        </header>

        <!-- Metric Cards -->
        <section class="metrics-grid">
            <div class="card">
                <h3>System Status</h3>
                <p class="metric-value" id="grid-status">Loading...</p>
                <span class="status optimal">Active Grid</span>
            </div>
            <div class="card">
                <h3>Average Purity (TDS)</h3>
                <p class="metric-value" id="avg-tds">-- <span>ppm</span></p>
                <span class="status optimal">BIS Standard Safe</span>
            </div>
            <div class="card">
                <h3>Active Pumps</h3>
                <p class="metric-value" id="active-pumps">--</p>
                <span class="status optimal">Fully Operational</span>
            </div>
        </section>

        <!-- Zone Status Section -->
        <section class="status-box">
            <h3>Municipal Zone Live Telemetry</h3>
            <ul id="zone-list">
                <li>Connecting to Flask Backend... <span class="badge yellow">Loading</span></li>
            </ul>
        </section>
    </div>

    <!-- JavaScript to fetch data from your Flask backend (app.py) -->
    <script>
        async function fetchDashboardData() {
            try {
                // Fetch System Health
                const healthRes = await fetch('http://127.0.0.1:5000/api/v1/health');
                const healthData = await healthRes.json();
                
                document.getElementById('grid-status').innerText = healthData.grid_status;
                document.getElementById('avg-tds').innerHTML = `${healthData.average_tds} <span>ppm</span>`;
                document.getElementById('active-pumps').innerText = healthData.total_pumps;

                // Fetch Live Zone Telemetry
                const telemetryRes = await fetch('http://127.0.0.1:5000/api/v1/telemetry');
                const telemetryData = await telemetryRes.json();

                const zoneList = document.getElementById('zone-list');
                zoneList.innerHTML = ''; // Clear loading text

                telemetryData.data.forEach(zone => {
                    const li = document.createElement('li');
                    const badgeClass = zone.status === 'OPTIMAL' ? 'green' : 'yellow';
                    
                    li.innerHTML = `
                        ${zone.zone} (Flow: ${zone.flow_rate_lps} L/s, TDS: ${zone.tds_ppm} ppm) 
                        <span class="badge ${badgeClass}">${zone.status}</span>
                    `;
                    zoneList.appendChild(li);
                });
            } catch (error) {
                console.error("Error connecting to backend:", error);
                document.getElementById('zone-list').innerHTML = `<li>Failed to connect to backend server. Make sure <strong>app.py</strong> is running. <span class="badge yellow">Offline</span></li>`;
            }
        }

        // Fetch data immediately on load, then every 5 seconds
        fetchDashboardData();
        setInterval(fetchDashboardData, 5000);
    </script>
</body>
</html>
