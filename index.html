<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroPulse Dehradun | Smart Water Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Dehradun Urban Water Supply Network</h1>
            <p>Real-time IoT Telemetry & Purity Analytics Engine</p>
        </header>

        <!-- Metric Cards -->
        <section class="metrics-grid">
            <div class="card">
                <h3>System Status</h3>
                <p class="metric-value" id="grid-status">OPERATIONAL</p>
                <span class="status optimal">Active Grid</span>
            </div>
            <div class="card">
                <h3>Average Purity (TDS)</h3>
                <p class="metric-value" id="avg-tds">142 <span>ppm</span></p>
                <span class="status optimal">BIS Standard Safe</span>
            </div>
            <div class="card">
                <h3>Active Pumps</h3>
                <p class="metric-value" id="active-pumps">18</p>
                <span class="status optimal">Fully Operational</span>
            </div>
        </section>

        <!-- Zone Status Section -->
        <section class="status-box">
            <h3>Municipal Zone Live Telemetry</h3>
            <ul id="zone-list">
                <!-- Dynamically updated by JavaScript simulation -->
            </ul>
        </section>
    </div>

    <script>
        const zones = ["Rajpur Road", "Clock Tower", "Prem Nagar", "Clement Town"];

        function updateTelemetry() {
            const zoneList = document.getElementById('zone-list');
            zoneList.innerHTML = '';

            zones.forEach(zone => {
                const flow = (Math.random() * (115 - 85) + 85).toFixed(2);
                const tds = Math.floor(Math.random() * (180 - 110) + 110);
                const pressureDrop = (Math.random() * (1.8 - 0.1) + 0.1).toFixed(2);
                
                const isLeak = pressureDrop > 1.2;
                const status = isLeak ? "LEAK DETECTED" : "OPTIMAL";
                const badgeClass = isLeak ? "yellow" : "green";

                const li = document.createElement('li');
                li.innerHTML = `
                    ${zone} (Flow: ${flow} L/s, TDS: ${tds} ppm) 
                    <span class="badge ${badgeClass}">${status}</span>
                `;
                zoneList.appendChild(li);
            });
        }

        updateTelemetry();
        setInterval(updateTelemetry, 4000); // Live updates every 4 seconds
    </script>
</body>
</html>
